name: News Bot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Забираем код и базу
        uses: actions/checkout@v4

      - name: Настраиваем Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Устанавливаем зависимости
        run: pip install feedparser requests

      - name: Запускаем бота
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python bot.py

      - name: Сохраняем историю постов в базу
        run: |
          git config user.name "NewsBot"
          git config user.email "bot@users.noreply.github.com"
          git add news_history.db
          git diff --staged --quiet || (git commit -m "Update news history" && git push)
          
